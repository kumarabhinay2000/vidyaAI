spring:
  application:
    name: vidyaai-aiservices
  main:
    allow-bean-definition-overriding: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: AiServiceHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: -1ms

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 3
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ai-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >
          VideoUploadedEvent:org.vidyaai.aiservices.event.VideoUploadedEvent,
          AiRegenerateEvent:org.vidyaai.aiservices.event.AiRegenerateEvent
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 10
    listener:
      auto-startup: false
      ack-mode: manual_immediate
      concurrency: 3
      type: single

  ai:
    openai:
      api-key: ${GROQ_API_KEY:mock-groq-key}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
          temperature: ${GROQ_TEMPERATURE:0.7}
          max-tokens: 4096
        enabled: true
      embedding:
        options:
          model: nomic-embed-text-v1_5
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        max-document-batch-size: 100
        initialize-schema: false

groq:
  api:
    key: ${GROQ_API_KEY:mock-groq-key}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:60}
    max-retries: ${GROQ_MAX_RETRIES:3}
    temperature: ${GROQ_TEMPERATURE:0.7}

ai:
  processing:
    chunk-size: 2000
    chunk-overlap: 200
    max-content-length: 50000
    async-core-pool-size: 5
    async-max-pool-size: 20
    async-queue-capacity: 100
  cache:
    summary-ttl-seconds: 604800
    notes-ttl-seconds: 604800
    quiz-ttl-seconds: 604800
    chatbot-ttl-seconds: 86400
    transcript-ttl-seconds: 2592000
  limits:
    max-chat-message-length: 2000
    max-chat-history-size: 10
    max-video-duration-seconds: 7200
    min-video-duration-seconds: 30

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    org.vidyaai.aiservices: DEBUG
    org.springframework.ai: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: logs/ai-service.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      groqChat:
        sliding-window-size: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
      groqEmbedding:
        sliding-window-size: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      groqChatRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.vidyaai.aiservices.exception.LlmTimeoutException
          - org.vidyaai.aiservices.exception.LlmProviderException
  bulkhead:
    instances:
      groqChatBulkhead:
        max-concurrent-calls: 25
        max-wait-duration: 100ms
  ratelimiter:
    instances:
      groqRateLimit:
        limit-for-period: 30
        limit-refresh-period: 60s
        timeout-duration: 5s
