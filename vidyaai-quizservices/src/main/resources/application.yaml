spring:
  application:
    name: vidyaai-quizservices

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://localhost:5432/quiz_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: QuizServiceHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: -1ms

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 3
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: quiz-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >
          AiProcessingCompletedEvent:org.vidyaai.quizservices.event.AiProcessingCompletedEvent,
          AiProcessingFailedEvent:org.vidyaai.quizservices.event.AiProcessingFailedEvent
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 10
    listener:
      auto-startup: false
      ack-mode: manual_immediate
      concurrency: 3

quiz:
  scoring:
    default-passing-percentage: 70
    negative-marking-enabled: false
    negative-mark-factor: 0.25
  attempts:
    max-attempts-per-quiz: 10
    cooldown-minutes: 5
  leaderboard:
    enabled: true
    max-entries: 100
    refresh-interval-seconds: 300
  cache:
    quiz-ttl-seconds: 3600
    analytics-ttl-seconds: 900
    leaderboard-ttl-seconds: 300
    user-stats-ttl-seconds: 600

security:
  jwt:
    secret: ${JWT_SECRET}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    org.vidyaai.quizservices: DEBUG
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: logs/quiz-service.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      kafkaProducer:
        sliding-window-size: 10
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      redisCache:
        sliding-window-size: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      kafkaProducerRetry:
        max-attempts: 3
        wait-duration: 2s